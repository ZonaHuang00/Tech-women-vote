<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TechWomen@TW — 投票完成</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* 全局防溢出 */
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }

      .ty-page {
        min-height: 100vh;
        background: linear-gradient(180deg, #1E1035 0%, #2A174E 40%, #150B28 100%);
        color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 24px;
        position: relative;
      }

      .ty-container {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: auto;
      }

      /* 打勾圓圈圖示 */
      .ty-check-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(34, 197, 94, 0.15);
        border: 2px solid #22C55E;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.35);
        margin-bottom: 4px;
      }
      .ty-check-circle svg {
        width: 40px;
        height: 40px;
        stroke: #22C55E;
      }

      .ty-title {
        font-size: 26px;
        font-weight: 800;
        text-align: center;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }

      .ty-subtitle {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
      }

      /* ★ 醒目禮物提醒卡片 */
      .gift-alert-card {
        width: 100%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 215, 0, 0.6); /* 金黃色微發光外框 */
        border-radius: 24px;
        padding: 22px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        box-shadow: 0 8px 32px rgba(255, 215, 0, 0.18), inset 0 0 20px rgba(255, 255, 255, 0.08);
        animation: pulseBorder 3s infinite alternate;
      }

      @keyframes pulseBorder {
        0% {
          border-color: rgba(255, 215, 0, 0.4);
          box-shadow: 0 4px 20px rgba(255, 215, 0, 0.12);
        }
        100% {
          border-color: rgba(255, 215, 0, 0.85);
          box-shadow: 0 8px 36px rgba(255, 215, 0, 0.28);
        }
      }

      .gift-icon-bounce {
        font-size: 42px;
        line-height: 1;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        animation: floatIcon 2.4s ease-in-out infinite;
      }

      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .gift-badge {
        background: linear-gradient(90deg, #F59E0B, #EF4444);
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 14px;
        border-radius: 999px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
      }

      .gift-main-title {
        font-size: 18px;
        font-weight: 800;
        color: #FFFFFF;
        line-height: 1.35;
      }

      .gift-desc {
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.5;
        max-width: 320px;
      }

      /* 活動提示卡片 (原下卡片) */
      .info-glass-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 20px 18px;
      }

      .info-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .info-card-logo {
        background: rgba(255, 255, 255, 0.15);
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.05em;
      }

      .info-card-title {
        font-size: 13px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
      }

      .info-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .info-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13.5px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.85);
      }

      .info-item-icon {
        font-size: 16px;
        flex-shrink: 0;
      }

      /* 移至底部的時間與編號卡片 (低調、扁平) */
      .details-sub-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.6);
      }

      .detail-row span:last-child {
        color: rgba(255, 255, 255, 0.85);
        font-weight: 500;
        font-family: monospace, sans-serif;
      }

      .ty-quote {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
        font-style: italic;
        margin-top: 4px;
      }

      .ty-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.35);
      }
    </style>
</head>
<body class="ty-page">

    <div class="ty-container">
        <!-- 成功打勾圖示 -->
        <div class="ty-check-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
        </div>

        <!-- 頂部感謝標題 -->
        <div style="text-align: center;">
            <h1 class="ty-title" id="tyTitle">感謝妳的參與！</h1>
            <p class="ty-subtitle" id="tySubtitle">投票已成功送出 🎉</p>
        </div>

        <!-- ★ 中間核心：醒目的小禮物領取提醒卡片 -->
        <div class="gift-alert-card">
            <div class="gift-icon-bounce">🎁</div>
            <div class="gift-badge" id="giftBadge">領取專屬小禮物</div>
            <div class="gift-main-title" id="giftTitle">請截圖或保留此畫面</div>
            <div class="gift-desc" id="giftDesc">憑此畫面可至場外服務台兌換精美紀念小禮一份喔！</div>
        </div>

        <!-- 活動資訊卡片 -->
        <div class="info-glass-card">
            <div class="info-card-header">
                <span class="info-card-logo">TW</span>
                <span class="info-card-title">2026 TechWomen@TW</span>
            </div>
            <div class="info-list" id="eventInfoList">
                <!-- 動態注入內容 -->
            </div>
        </div>

        <!-- 移至最下方的投票時間與編號 (不搶眼) -->
        <div class="details-sub-card">
            <div class="detail-row">
                <span id="labelTime">投票時間</span>
                <span id="tyTime">--</span>
            </div>
            <div class="detail-row">
                <span id="labelId">投票編號</span>
                <span id="tyId">--</span>
            </div>
        </div>

        <p class="ty-quote" id="tyQuote">妳的每一個選擇，都在推動科技更具包容力。</p>
        <footer class="ty-footer">TechWomen@TW &copy; 2026</footer>
    </div>

    <!-- 載入 content.js -->
    <script src="content.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var params = new URLSearchParams(window.location.search);
        var lang = params.get('lang') || 'zh'; // 自動辨識使用者在上一頁選的語言
        var voteTime = params.get('t') || '--';
        var voteId = params.get('id') || '—';

        // 讀取 content.js 中對應語言的感謝頁設定
        var tyContent = (typeof CONTENT !== 'undefined' && CONTENT.thankyou && CONTENT.thankyou[lang]) 
          ? CONTENT.thankyou[lang] 
          : ((typeof CONTENT !== 'undefined' && CONTENT.thankyou && CONTENT.thankyou['zh']) ? CONTENT.thankyou['zh'] : {});

        // 注入文字
        if (tyContent.title) document.getElementById('tyTitle').textContent = tyContent.title;
        if (tyContent.subtitle) document.getElementById('tySubtitle').textContent = tyContent.subtitle;
        if (tyContent.giftBadge) document.getElementById('giftBadge').textContent = tyContent.giftBadge;
        if (tyContent.giftTitle) document.getElementById('giftTitle').textContent = tyContent.giftTitle;
        if (tyContent.giftDesc) document.getElementById('giftDesc').textContent = tyContent.giftDesc;
        if (tyContent.timeLabel) document.getElementById('labelTime').textContent = tyContent.timeLabel;
        if (tyContent.idLabel) document.getElementById('labelId').textContent = tyContent.idLabel;
        if (tyContent.footerQuote) document.getElementById('tyQuote').textContent = tyContent.footerQuote;

        document.getElementById('tyTime').textContent = voteTime;
        document.getElementById('tyId').textContent = voteId;

        // 渲染資訊清單
        var infoListEl = document.getElementById('eventInfoList');
        if (infoListEl && tyContent.eventInfo) {
          infoListEl.innerHTML = '';
          tyContent.eventInfo.forEach(function(item) {
            var row = document.createElement('div');
            row.className = 'info-item';
            row.innerHTML = '<span class="info-item-icon">' + item.icon + '</span><span>' + item.text + '</span>';
            infoListEl.appendChild(row);
          });
        }
      });
    </script>
</body>
</html>
