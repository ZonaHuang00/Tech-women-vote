<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 TechWomen@TW — 現場投票</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* ================= 全局與容器修復（防溢出） ================= */
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden; /* 徹底杜絕橫向滑動 */
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      .container {
        width: 100% !important;
        max-width: 640px !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        margin: 0 auto !important;
        box-sizing: border-box !important;
      }

      /* 語言切換膠囊按鈕 */
      .lang-switch-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
        position: relative;
        z-index: 10;
      }
      .lang-pill {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 4px;
        gap: 4px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .lang-toggle-btn {
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .lang-toggle-btn.active {
        background: #FFFFFF;
        color: #4F46E5;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .lang-hint-text {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 6px;
      }

      /* ================= 核心修復：題目卡片與雙欄排版 ================= */
      .question-card {
        width: 100% !important;
        box-sizing: border-box !important;
        padding: 24px 16px !important; /* 縮小卡片內距，給文字更多空間 */
      }

      /* 解決問題 1 & 2：強制定寬 50%/50% 與等高對齊 */
      .chip-grid {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important; /* 確保左右等寬且不被長英文撐破 */
        gap: 10px !important;
        width: 100% !important;
        align-items: stretch !important; /* 讓同一橫列卡片等高 */
      }

      .vote-chip {
        display: flex !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        cursor: pointer;
      }

      .vote-chip input[type="checkbox"] {
        display: none !important;
      }

      /* 選項外框：等高、彈性垂直置中 */
      .chip-face {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        width: 100% !important;
        min-height: 64px !important; /* 設定統一基礎高度，確保單行/多行皆平整 */
        padding: 10px 10px 10px 12px !important;
        border-radius: 16px !important;
        background: rgba(255, 255, 255, 0.8) !important;
        border: 1.5px solid rgba(226, 232, 240, 0.8) !important;
        box-sizing: border-box !important;
        transition: all 0.2s ease !important;
        gap: 8px !important;
      }

      /* 選項 Emoji */
      .chip-icon {
        font-size: 19px !important;
        line-height: 1 !important;
        flex-shrink: 0 !important;
      }

      /* 選項文字：自動折行且不撐破版面 */
      .chip-text {
        flex: 1 1 auto !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        line-height: 1.25 !important;
        color: #1E293B !important;
        word-break: break-word !important; /* 長單字自動斷行 */
        hyphens: auto !important;
        text-align: left !important;
      }

      /* 勾選圓圈：固定在最右側不被壓縮 */
      .chip-check-ring {
        width: 20px !important;
        height: 20px !important;
        flex-shrink: 0 !important;
        border-radius: 50% !important;
        border: 1.5px solid #CBD5E1 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        transition: all 0.2s ease !important;
        background: #FFFFFF !important;
      }

      .chip-check-ring svg {
        width: 12px !important;
        height: 12px !important;
        opacity: 0 !important;
        transform: scale(0.5) !important;
        transition: all 0.2s ease !important;
      }

      /* 選中狀態樣式 (Q1 藍紫色) */
      .vote-chip input[type="checkbox"]:checked + .chip-face {
        background: #EEF2FF !important;
        border-color: #6366F1 !important;
        box-shadow: 0 0 0 1px #6366F1 !important;
      }
      .vote-chip input[type="checkbox"]:checked + .chip-face .chip-check-ring {
        background: #6366F1 !important;
        border-color: #6366F1 !important;
      }
      .vote-chip input[type="checkbox"]:checked + .chip-face .chip-check-ring svg {
        opacity: 1 !important;
        transform: scale(1) !important;
        stroke: #FFFFFF !important;
      }

      /* 選中狀態樣式 (Q2 粉色系) */
      .vote-chip--pink input[type="checkbox"]:checked + .chip-face {
        background: #FDF2F8 !important;
        border-color: #EC4899 !important;
        box-shadow: 0 0 0 1px #EC4899 !important;
      }
      .vote-chip--pink input[type="checkbox"]:checked + .chip-face .chip-check-ring {
        background: #EC4899 !important;
        border-color: #EC4899 !important;
      }

      /* 選中狀態樣式 (Q3 綠藍色系) */
      .vote-chip--teal input[type="checkbox"]:checked + .chip-face {
        background: #F0FDFA !important;
        border-color: #14B8A6 !important;
        box-shadow: 0 0 0 1px #14B8A6 !important;
      }
      .vote-chip--teal input[type="checkbox"]:checked + .chip-face .chip-check-ring {
        background: #14B8A6 !important;
        border-color: #14B8A6 !important;
      }
    </style>
</head>
<body class="vote-page">

    <!-- ===== Hero ===== -->
    <section class="hero">
        <div class="hero-bg">
            <div class="hero-orb orb-1"></div>
            <div class="hero-orb orb-2"></div>
            <div class="hero-orb orb-3"></div>
            <div class="hero-orb orb-4"></div>
            <div class="hero-mesh"></div>
        </div>
        <div class="hero-content">
            <!-- 語言切換器 -->
            <div class="lang-switch-wrapper">
                <div class="lang-pill">
                    <button type="button" id="langBtnZh" class="lang-toggle-btn active" onclick="VoteApp.setLanguage('zh')">中文</button>
                    <button type="button" id="langBtnEn" class="lang-toggle-btn" onclick="VoteApp.setLanguage('en')">English</button>
                </div>
                <div id="langHint" class="lang-hint-text">可隨時切換語言</div>
            </div>

            <div class="hero-logo">
                <div class="logo-icon"><span class="logo-symbol">TW</span></div>
                <div class="logo-text">
                    <span class="logo-year">2026</span>
                    <span class="logo-name">TechWomen<span class="logo-at">@</span>TW</span>
                </div>
            </div>
            <h1 class="hero-theme">
                <span class="theme-line">跨世代共融</span>
                <span class="theme-sep">×</span>
                <span class="theme-line">AI</span>
                <span class="theme-sep">×</span>
                <span class="theme-line">女性領導力</span>
            </h1>
            <p class="hero-welcome">歡迎每一位開創未來的妳。<br>妳的聲音，將成為改變的力量。</p>
            <div class="hero-dots"><span></span><span></span><span></span></div>
            <div class="hero-badge"><span class="badge-glow"></span>✦ 午餐時段 · 現場互動投票</div>
        </div>
        <div class="scroll-hint">
            <span>向下滑動開始投票</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </section>

    <!-- ===== Vote Body ===== -->
    <main class="vote-main">
        <div class="container">

            <!-- Status -->
            <div class="status-pill">
                <span class="live-dot"></span>
                <span id="liveStatusText">投票進行中</span>
                <span class="status-sep">·</span>
                <span><span id="countPrefixText">已有 </span><strong id="voterCount">--</strong><span id="countSuffixText"> 人參與</span></span>
            </div>

            <form id="voteForm" autocomplete="off">
                <!-- 動態放置 Q1, Q2, Q3 題目卡片區 -->
                <div id="questionsContainer"></div>

                <!-- Submit -->
                <div class="submit-area">
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">送出我的投票</span>
                        <span class="btn-arrow"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3.75 9h10.5M9.75 4.5L14.25 9l-4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                        <span class="btn-loading"><span class="spinner"></span>送出中⋯</span>
                    </button>
                    <p class="submit-note">每人限投一次，送出後無法修改</p>
                </div>
            </form>

            <!-- Already Voted -->
            <div class="state-screen" id="alreadyVotedScreen" style="display:none;">
                <div class="state-icon">🗳️</div>
                <h2>妳已完成投票</h2>
                <p>每人限投一次，感謝妳的參與！</p>
                <p class="state-sub">結果將在下午 Workshop 時公佈</p>
            </div>

            <!-- Closed -->
            <div class="state-screen" id="closedScreen" style="display:none;">
                <div class="state-icon">⏰</div>
                <h2>投票已截止</h2>
                <p>感謝妳的關注，請期待下午的結果公佈！</p>
                <a href="result.html" class="cta-link">查看投票結果</a>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        <span class="footer-brand">TechWomen<span>@</span>TW</span>
        <span class="footer-copy">© 2026</span>
    </footer>

    <script src="content.js"></script>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { VoteApp.init(); });</script>
</body>
</html>
